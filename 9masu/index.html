<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>9マスノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e1c1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="3×3のマスに書く9マスノート">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<script>
// 表示の好みは、この端末のブラウザにだけ覚えさせる（読めなくても暗い表示・ふつうの大きさで出す）
try{ if(localStorage.getItem("masu-theme")==="light") document.documentElement.setAttribute("data-masu","light");
     if(localStorage.getItem("masu-size")==="xl") document.documentElement.classList.add("xl"); }catch(e){}
</script>
<style>
/* 3×3のマスが主役。上に日付、下に「書いた日」。
   既定は暗い表示（2026-09-24 本人希望：老眼・白内障のため）。色はダッシュボードと揃える */
:root{
  --bg:#1e1c1a; --fg:#f4efe8; --muted:#d0c6ba; --line:#5a5047;
  --card:#2b2723; --soft:#36302a; --core:#3b2d21; --core-line:#ffa45c;
  --accent:#ffa45c; --accent-ink:#ffbb82; --on-accent:#1e1c1a;
  --go:#74e3a8; --stop:#ff9582;
  --font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-masu="light"]{
  --bg:#fffaf2; --fg:#2d2824; --muted:#5f544b; --line:#cdb89f;
  --card:#ffffff; --soft:#fff3e4; --core:#fde9d2; --core-line:#d8702d;
  --accent:#d8702d; --accent-ink:#a94f12; --on-accent:#ffffff;
  --go:#237f53; --stop:#c0402e;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html.xl body{zoom:1.15}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:18px;line-height:1.7;font-weight:700;overflow-wrap:anywhere}
.wrap{max-width:760px;margin:0 auto;padding-block:12px 72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;font-weight:700;cursor:pointer;color:var(--fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 見出しと表示の好み */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
h1{margin:0;font-size:26px;letter-spacing:.06em;line-height:1.3}
.prefs{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:6px 14px;font-size:15px;min-height:44px}

/* 日付 */
.datebar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.nav{background:var(--soft);border:1px solid var(--line);border-radius:12px;
  padding:6px 12px;font-size:16px;min-height:48px;white-space:nowrap}
.dateblock{text-align:center;min-width:0}
.date{font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.dsub{font-size:15px;color:var(--muted)}
.dsub.today{color:var(--accent-ink)}
.statusrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;min-height:28px}
.status{margin:0;font-size:15px;color:var(--muted);text-align:center}
.status.ok{color:var(--go)}
.status.ng{color:var(--stop)}
.link{background:none;border:0;padding:4px 2px;font-size:15px;color:var(--accent-ink);
  text-decoration:underline;text-underline-offset:3px;min-height:36px}
.notice{margin:0;padding:10px 14px;border-radius:12px;background:var(--soft);
  border:1px solid var(--line);font-size:16px}

/* 広げているときの帯 */
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  padding:10px 12px;border-radius:12px;background:var(--soft)}
.subinfo{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px;font-size:17px}
.subinfo span:last-child{min-width:0}
.minimap{display:inline-grid;grid-template-columns:repeat(3,10px);gap:2px;flex:none}
.minimap i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line)}
.minimap i.c{border-color:var(--muted)}
.minimap i.on{background:var(--accent);border-color:var(--accent)}

/* 9マス本体 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:stretch;
  min-height:clamp(108px, 26vw, 200px);padding:10px 8px;border-radius:14px;
  background:var(--card);border:2px dashed var(--line);cursor:text}
.cell.filled{border-style:solid}
.cell.core{background:var(--core);border:3px solid var(--core-line)}
.cell:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.cell textarea{display:block;width:100%;min-height:1.6em;margin:0;padding:0;border:0;outline:none;resize:none;
  overflow:hidden;background:transparent;color:var(--fg);font:inherit;font-size:18px;line-height:1.55;
  text-align:center}
.cell textarea::placeholder{color:var(--muted);opacity:.85}
.expand{align-self:center;margin-top:8px;padding:4px 12px;min-height:40px;border-radius:999px;
  background:var(--soft);border:1px solid var(--line);color:var(--accent-ink);font-size:15px;white-space:nowrap}
.expand .n{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:4px}
.hint{margin:0;font-size:16px;color:var(--muted)}

/* 画像で保存 */
.saves{display:flex;flex-direction:column;gap:8px}
.saves .btns{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:16px;min-height:48px}
.saves p{margin:0;font-size:15px;color:var(--muted)}

/* 書いた日 */
.history h2{margin:6px 0 8px;font-size:19px;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;
  font-size:16px;min-height:44px;text-align:left;line-height:1.4}
.chip .n{display:block;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{border:2px solid var(--accent)}
.empty{margin:0;font-size:16px;color:var(--muted)}

@media (max-width:420px){
  .nav{padding:6px 8px;font-size:15px}
  .date{font-size:21px}
  .cell{padding:8px 5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.install{display:grid;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:18px;line-height:1.5}
.install p{margin:0}
.install .ib{display:flex;gap:10px;flex-wrap:wrap}
.install button{min-height:52px;padding:0 18px;font-size:18px;border-radius:12px}
.install #installBtn{background:var(--accent);color:var(--on-accent);border:0}
.install #installClose{background:transparent;border:1px solid var(--line)}
</style>
</head><body>
<div class="wrap">
  <div class="install" id="installBox" hidden>
    <p id="installMsg">ホーム画面に追加すると、アプリのように開けます。</p>
    <div class="ib"><button type="button" id="installBtn">ホーム画面に追加</button><button type="button" id="installClose">閉じる</button></div>
  </div>
  <header class="top">
    <h1>9マスノート</h1>
    <div class="prefs">
      <button type="button" id="btn-theme" class="pbtn">明るい表示にする</button>
      <button type="button" id="btn-size" class="pbtn">文字を大きく</button>
    </div>
  </header>

  <nav class="datebar" aria-label="日付">
    <button type="button" id="prev" class="nav">‹ 前の日</button>
    <div class="dateblock">
      <div id="date-label" class="date"></div>
      <div id="date-sub" class="dsub"></div>
    </div>
    <button type="button" id="next" class="nav">次の日 ›</button>
  </nav>

  <div class="statusrow">
    <p id="status" class="status" aria-live="polite">保存先につないでいます…</p>
    <button type="button" id="to-today" class="link" hidden>今日に戻る</button>
  </div>
  <p id="notice" class="notice" hidden></p>

  <div id="subbar" class="subbar" hidden>
    <button type="button" id="back" class="pbtn">‹ 9マスに戻る</button>
    <div class="subinfo"><span id="minimap" class="minimap" aria-hidden="true"></span><span id="subtitle"></span></div>
  </div>

  <section id="grid" class="grid" aria-label="9マス"></section>
  <p id="hint" class="hint"></p>

  <section id="saves" class="saves" hidden>
    <div class="btns">
      <button type="button" id="save-png" class="sbtn">この9マスを画像で保存</button>
      <button type="button" id="save-blank" class="sbtn">白紙の9マスを保存</button>
    </div>
    <p>画像は白い地で保存します。白紙は印刷して手書きにも使えます。</p>
  </section>

  <section class="history">
    <h2>書いた日</h2>
    <div id="history" class="chips"></div>
  </section>
</div>

<script>
(function(){
  "use strict";
  // マスの並び（0〜8）。4がまんなか。広げた9マスのまんなかは、もとのマスと同じ文字を指す
  var POS = ["左上","上","右上","左","まんなか","右","左下","下","右下"];
  var $ = function(id){ return document.getElementById(id); };

  var fmtYMD = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"});
  var fmtWd = new Intl.DateTimeFormat("ja-JP",{timeZone:"UTC",weekday:"short"});
  var fmtHM = new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"numeric",minute:"2-digit"});
  function today(){ return fmtYMD.format(new Date()); }
  function parts(ds){ var p = ds.split("-"); return {y:+p[0], m:+p[1], d:+p[2]}; }
  function addDays(ds, n){ var p = parts(ds); return new Date(Date.UTC(p.y,p.m-1,p.d+n)).toISOString().slice(0,10); }
  function wd(ds){ var p = parts(ds); return fmtWd.format(new Date(Date.UTC(p.y,p.m-1,p.d))); }
  function dateLabel(ds){ var p = parts(ds); return p.m + "月" + p.d + "日（" + wd(ds) + "）"; }
  function shortLabel(ds){ var p = parts(ds); return p.m + "/" + p.d + "（" + wd(ds) + "）"; }

  function blank9(){ return ["","","","","","","","",""]; }
  function blankDay(){ return {grid:blank9(), subs:{}}; }
  function clean9(a){ var out = blank9(); if(Array.isArray(a)) for(var i=0;i<9;i++) out[i] = typeof a[i]==="string" ? a[i] : ""; return out; }
  function normalize(d){
    var day = blankDay(); if(!d) return day;
    day.grid = clean9(d.grid);
    if(d.subs && typeof d.subs==="object") Object.keys(d.subs).forEach(function(k){
      var i = +k; if(i>=0 && i<9 && i!==4) day.subs[i] = clean9(d.subs[k]);
    });
    return day;
  }
  function subCount(day, k){ var s = day.subs[k]; if(!s) return 0; var n=0; for(var i=0;i<9;i++) if(i!==4 && s[i].trim()) n++; return n; }
  function filled(day){ return day.grid.filter(function(v){ return v.trim(); }).length; }
  function hasAny(day){ if(filled(day)) return true; for(var k=0;k<9;k++) if(subCount(day,k)) return true; return false; }

  var state = { date: today(), view: -1, days: {} };
  var dirty = {};      // 保存がまだ終わっていない日（届いた記録で上書きしない）
  var mode = "connecting"; // connecting | db | local
  var db = null, downloads = null;

  function day(ds){ ds = ds || state.date; if(!state.days[ds]) state.days[ds] = blankDay(); return state.days[ds]; }
  // いま画面に出ている9つの値
  function values(){
    var d = day();
    if(state.view < 0) return d.grid.slice();
    var s = d.subs[state.view] || blank9(); var v = s.slice(); v[4] = d.grid[state.view]; return v;
  }
  function setValue(i, text){
    var d = day();
    if(state.view < 0 || i === 4){ d.grid[state.view < 0 ? i : state.view] = text; }
    else { if(!d.subs[state.view]) d.subs[state.view] = blank9(); d.subs[state.view][i] = text; }
  }

  /* ---------- 表示 ---------- */
  var tas = [];
  function autosize(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

  function buildGrid(){
    var g = $("grid"); g.textContent = ""; tas = [];
    var v = values(), d = day();
    for(var i=0;i<9;i++){
      var cell = document.createElement("div");
      cell.className = "cell" + (i===4 ? " core" : "");
      var ta = document.createElement("textarea");
      ta.id = "masu-" + i; ta.rows = 1; ta.value = v[i];
      ta.setAttribute("aria-label", state.view < 0 ? POS[i] + "のマス" : "「" + POS[state.view] + "」を広げた9マスの" + POS[i]);
      if(i===4) ta.placeholder = state.view < 0 ? "今日のまんなか" : POS[state.view] + "のマス";
      ta.addEventListener("input", onInput(i));
      cell.appendChild(ta);
      if(state.view < 0 && i !== 4){
        var b = document.createElement("button");
        b.type = "button"; b.className = "expand"; b.id = "expand-" + i;
        b.addEventListener("click", openSub(i));
        cell.appendChild(b);
      }
      cell.addEventListener("click", focusCell(ta));
      g.appendChild(cell); tas.push(ta);
    }
    tas.forEach(autosize);
    paintCells();
  }
  function focusCell(ta){ return function(e){ if(e.target.closest("button")) return; if(e.target !== ta) ta.focus(); }; }
  function paintCells(){
    var v = values(), d = day();
    tas.forEach(function(ta, i){
      ta.parentNode.classList.toggle("filled", !!v[i].trim());
      var b = $("expand-" + i);
      if(b){
        var n = subCount(d, i);
        b.hidden = !(v[i].trim() || n);
        b.innerHTML = "広げる" + (n ? '<span class="n">' + n + "/8</span>" : "");
        b.setAttribute("aria-label", POS[i] + "のマスを9マスに広げる" + (n ? "（" + n + "マス書いてあります）" : ""));
      }
    });
  }
  // 届いた記録を画面に反映する（書いている途中のマスには触らない）
  function refreshValues(){
    var v = values();
    tas.forEach(function(ta, i){
      if(ta !== document.activeElement && ta.value !== v[i]){ ta.value = v[i]; autosize(ta); }
    });
    paintCells();
    if(state.view >= 0) paintSubbar();
  }

  function paintHeader(){
    var t = today();
    $("date-label").textContent = dateLabel(state.date);
    var sub = $("date-sub");
    if(state.date === t){ sub.textContent = "今日"; sub.className = "dsub today"; }
    else { var diff = Math.round((Date.parse(state.date) - Date.parse(t)) / 864e5);
      sub.textContent = diff < 0 ? (-diff) + "日前" : diff + "日後"; sub.className = "dsub"; }
    $("to-today").hidden = state.date === t;
  }
  function paintSubbar(){
    var bar = $("subbar");
    if(state.view < 0){ bar.hidden = true; return; }
    bar.hidden = false;
    var mm = $("minimap"); mm.textContent = "";
    for(var i=0;i<9;i++){ var c = document.createElement("i"); if(i===state.view) c.className = "on"; else if(i===4) c.className = "c"; mm.appendChild(c); }
    var center = day().grid[state.view].trim();
    $("subtitle").textContent = center ? "「" + center.replace(/\s+/g," ") + "」を広げています" : POS[state.view] + "のマスを広げています";
  }
  function paintHint(){
    $("hint").textContent = state.view < 0
      ? "真ん中に、今日のまんなかを。まわりの8マスには、思いついたことを書きます。書いたマスには「広げる」が出て、そのマスを真ん中にした9マスが開きます。"
      : "真ん中は、もとの9マスの「" + POS[state.view] + "」と同じマスです。どちらで書き直しても、両方に入ります。";
  }
  function paintHistory(){
    var box = $("history"); box.textContent = "";
    var ds = Object.keys(state.days).filter(function(k){ return hasAny(state.days[k]); }).sort().reverse().slice(0, 30);
    if(!ds.length){
      var p = document.createElement("p"); p.className = "empty";
      p.textContent = "まだありません。マスに書くと、その日がここに並びます。";
      box.appendChild(p); return;
    }
    ds.forEach(function(k){
      var dd = state.days[k], n = filled(dd), x = 0;
      for(var j=0;j<9;j++) if(subCount(dd,j)) x++;
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip" + (k === state.date ? " on" : "");
      b.innerHTML = shortLabel(k) + '<span class="n">9マスのうち' + n + (x ? "・広げた" + x : "") + "</span>";
      b.addEventListener("click", function(){ go(k, -1); });
      box.appendChild(b);
    });
  }
  function render(){ paintHeader(); paintSubbar(); paintHint(); buildGrid(); paintHistory(); }

  function go(ds, view){
    flushAll();
    state.date = ds; state.view = view == null ? -1 : view;
    render(); window.scrollTo({top:0});
  }
  function openSub(i){ return function(){ state.view = i; render(); var c = tas[4]; if(c && !c.value) c.focus(); }; }

  /* ---------- 保存 ---------- */
  function setStatus(kind, text){
    var s = $("status"); s.textContent = text;
    s.className = "status" + (kind === "ok" ? " ok" : kind === "ng" ? " ng" : "");
  }
  function hm(){ return fmtHM.format(new Date()); }

  var timers = {}, inflight = {}, again = {}, edits = {};
  function onInput(i){
    return function(e){
      setValue(i, e.target.value); autosize(e.target); paintCells();
      if(state.view >= 0 && i === 4) paintSubbar();
      var ds = state.date; dirty[ds] = true; edits[ds] = (edits[ds] || 0) + 1;
      clearTimeout(timers[ds]); timers[ds] = setTimeout(function(){ flush(ds); }, 700);
      if(mode !== "connecting") setStatus("", "保存中…");
    };
  }
  function body(ds){
    var d = day(ds), subs = {};
    Object.keys(d.subs).forEach(function(k){ if(subCount(d, +k)){ var s = d.subs[k].slice(); s[4] = ""; subs[k] = s; } });
    return {date:ds, grid:d.grid.slice(), subs:subs, filled:filled(d), updatedAt:new Date().toISOString()};
  }
  function writeLocal(ds){
    try{
      if(hasAny(day(ds))) localStorage.setItem("9masu:" + ds, JSON.stringify(body(ds)));
      else localStorage.removeItem("9masu:" + ds);
      return true;
    }catch(e){ return false; }
  }
  async function writeDb(ds){
    var ref = db.collection("days").doc(ds);
    if(hasAny(day(ds))) await ref.set(body(ds)); else await ref.delete();
  }
  async function flush(ds){
    clearTimeout(timers[ds]);
    if(!dirty[ds] || mode === "connecting") return;
    if(mode === "local"){
      if(writeLocal(ds)){ dirty[ds] = false; setStatus("ok", "この端末に保存しました（" + hm() + "）"); }
      else setStatus("ng", "この端末に保存できませんでした。画面を閉じると消えます");
      paintHistory(); return;
    }
    if(inflight[ds]){ again[ds] = true; return; }
    inflight[ds] = true; var v = edits[ds];
    try{
      try{ await writeDb(ds); }
      catch(e){ if(e && e.code === "unavailable"){ await new Promise(function(r){ setTimeout(r, 1200 + Math.random()*800); }); await writeDb(ds); } else throw e; }
      if(edits[ds] === v) dirty[ds] = false;
      setStatus("ok", "保存しました（" + hm() + "）");
    }catch(e){
      var c = e && e.code;
      setStatus("ng", c === "quota_exceeded" ? "保存先がいっぱいで、保存できませんでした"
        : "保存できませんでした。つながりが戻ったら、どこかのマスに一文字足すと保存し直します");
    }
    inflight[ds] = false;
    paintHistory();
    if(again[ds]){ again[ds] = false; flush(ds); }
  }
  function flushAll(){ Object.keys(dirty).forEach(function(ds){ if(dirty[ds]) flush(ds); }); }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flushAll(); });

  /* ---------- 保存先につなぐ ---------- */
  function startLocal(){
    mode = "local";
    try{
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("9masu:") === 0){ var ds = k.slice(6); if(!dirty[ds]) state.days[ds] = normalize(JSON.parse(localStorage.getItem(k))); }
      }
    }catch(e){}
    var n = $("notice"); n.hidden = false;
    n.textContent = "書いたものは、このスマホの中に残ります。ほかの端末とはつながりません。";
    setStatus("", "書くと、この端末に残ります");
    refreshValues(); paintHistory(); flushAll();
  }
  function startDb(){
    mode = "db";
    setStatus("", "書くと自動で残ります");
    db.collection("days").orderBy("date", "desc").limit(1000).onSnapshot(function(snap){
      snap.docChanges().forEach(function(ch){
        var ds = ch.doc.id; if(dirty[ds]) return;
        if(ch.type === "removed") delete state.days[ds];
        else state.days[ds] = normalize(ch.doc.data());
      });
      refreshValues(); paintHistory();
    }, function(e){
      setStatus("ng", "記録の読み込みが止まりました。画面を開き直すと戻ります");
    });
    flushAll();
  }
  async function connect(){
    var c = window.claude;
    if(!c || typeof c.use !== "function"){
      // アプリ版：画像はこの端末に保存（ダウンロード）する
      downloads = { save: function(o){ return new Promise(function(res){
        var url = URL.createObjectURL(o.data), a = document.createElement("a");
        a.href = url; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); res(true); }); } };
      $("saves").hidden = false;
      startLocal(); return;
    }
    c.use("downloads").then(function(d){ if(d){ downloads = d; $("saves").hidden = false; } }).catch(function(){});
    try{ db = await c.use("db"); }catch(e){ db = null; }
    if(db) startDb(); else startLocal();
  }

  /* ---------- 画像で保存（白い地・印刷向け） ---------- */
  var FAM = '"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';
  function wrapLines(g, text, maxW){
    var out = [];
    text.split("\n").forEach(function(par){
      var line = "";
      Array.from(par).forEach(function(ch){
        if(g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; } else line += ch;
      });
      out.push(line);
    });
    while(out.length && !out[out.length-1].trim()) out.pop();
    return out;
  }
  function drawText(g, text, x, y, size, ink){
    if(!text.trim()) return;
    var maxW = size - 44, maxH = size - 40, fs = 34, lh, lines;
    for(;;){
      g.font = "700 " + fs + "px " + FAM; lh = Math.round(fs * 1.42);
      lines = wrapLines(g, text.trim(), maxW);
      if(lines.length * lh <= maxH || fs <= 24) break;
      fs -= 4;
    }
    var maxLines = Math.floor(maxH / lh);
    if(lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines-1] = lines[maxLines-1].slice(0, -1) + "…"; }
    g.fillStyle = ink; g.textAlign = "center"; g.textBaseline = "middle";
    var y0 = y + size/2 - (lines.length - 1) * lh / 2;
    lines.forEach(function(l, k){ g.fillText(l, x + size/2, y0 + k * lh); });
  }
  function box(g, x, y, w, h, r){
    g.beginPath();
    if(g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
  }
  async function exportPng(isBlank){
    if(!downloads) return;
    try{ await document.fonts.load('700 34px "BIZ UDPGothic"'); }catch(e){}
    var W = 1240, pad = 70, gap = 14, top = 190, size = W - pad*2, cell = (size - gap*2) / 3, H = top + size + pad;
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var g = cv.getContext("2d");
    var paper = "#fffdf8", ink = "#2a2420", sub = "#6a5e54", line = "#5a4f45", coreBg = "#fbe8d4", coreLine = "#c8661f";
    g.fillStyle = paper; g.fillRect(0, 0, W, H);
    g.textBaseline = "alphabetic";
    g.fillStyle = ink; g.textAlign = "left"; g.font = "700 50px " + FAM; g.fillText("9マスノート", pad, 105);
    g.fillStyle = sub; g.textAlign = "right"; g.font = "700 34px " + FAM;
    g.fillText(isBlank ? "　　月　　日（　　）" : dateLabel(state.date), W - pad, 105);
    var v = isBlank ? blank9() : values();
    if(!isBlank && state.view >= 0){
      g.textAlign = "left"; g.font = "700 28px " + FAM;
      var c = (v[4] || POS[state.view] + "のマス").replace(/\s+/g, " ");
      if(c.length > 26) c = c.slice(0, 25) + "…";
      g.fillText("「" + c + "」を広げたところ", pad, 158);
    }
    for(var i=0;i<9;i++){
      var x = pad + (i % 3) * (cell + gap), y = top + Math.floor(i / 3) * (cell + gap);
      box(g, x, y, cell, cell, 18);
      g.fillStyle = i === 4 ? coreBg : "#ffffff"; g.fill();
      g.lineWidth = i === 4 ? 5 : 3; g.strokeStyle = i === 4 ? coreLine : line; g.stroke();
      if(isBlank && i === 4){
        g.fillStyle = "#b3a28f"; g.textAlign = "center"; g.textBaseline = "middle"; g.font = "700 30px " + FAM;
        g.fillText("今日のまんなか", x + cell/2, y + cell/2);
        continue;
      }
      drawText(g, v[i], x, y, cell, ink);
    }
    var blob = await new Promise(function(r){ cv.toBlob(r, "image/png"); });
    var name = isBlank ? "9マス_白紙.png" : "9マス_" + state.date + (state.view >= 0 ? "_" + POS[state.view] : "") + ".png";
    try{
      await downloads.save({filename:name, data:blob});
      setStatus("ok", "画像を保存しました");
    }catch(e){
      var code = e && e.code;
      if(code === "declined") setStatus("", "画像の保存はやめました");
      else if(code === "rate_limited") setStatus("", "少し待ってから、もう一度押してください");
      else { setStatus("ng", "この画面では画像を保存できません"); $("saves").hidden = true; }
    }
  }

  /* ---------- 操作 ---------- */
  $("prev").addEventListener("click", function(){ go(addDays(state.date, -1)); });
  $("next").addEventListener("click", function(){ go(addDays(state.date, 1)); });
  $("to-today").addEventListener("click", function(){ go(today()); });
  $("back").addEventListener("click", function(){ var k = state.view; state.view = -1; render(); var b = $("expand-" + k); if(b && !b.hidden) b.focus(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && state.view >= 0) $("back").click(); });
  $("save-png").addEventListener("click", function(){ exportPng(false); });
  $("save-blank").addEventListener("click", function(){ exportPng(true); });

  function paintPrefs(){
    var light = document.documentElement.getAttribute("data-masu") === "light";
    $("btn-theme").textContent = light ? "暗い表示にする" : "明るい表示にする";
    $("btn-size").textContent = document.documentElement.classList.contains("xl") ? "文字をふつうに" : "文字を大きく";
  }
  $("btn-theme").addEventListener("click", function(){
    var r = document.documentElement, light = r.getAttribute("data-masu") === "light";
    if(light) r.removeAttribute("data-masu"); else r.setAttribute("data-masu", "light");
    try{ localStorage.setItem("masu-theme", light ? "dark" : "light"); }catch(e){}
    paintPrefs();
  });
  $("btn-size").addEventListener("click", function(){
    var on = document.documentElement.classList.toggle("xl");
    try{ localStorage.setItem("masu-size", on ? "xl" : "normal"); }catch(e){}
    paintPrefs(); tas.forEach(autosize);
  });
  window.addEventListener("resize", function(){ tas.forEach(autosize); });

  paintPrefs();
  render();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ tas.forEach(autosize); });
  connect();
})();
</script>

<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
(function () {
  var box = document.getElementById("installBox"), btn = document.getElementById("installBtn"), msg = document.getElementById("installMsg"), deferred = null;
  var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  var closed = false; try { closed = localStorage.getItem("installClosed") === "1"; } catch (e) {}
  if (standalone || closed) return;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; btn.hidden = false; msg.textContent = "ホーム画面に追加すると、アプリのように開けます。電波がなくても書けます。"; box.hidden = false; });
  setTimeout(function () { if (!deferred && box.hidden) { btn.hidden = true; msg.textContent = "アプリにするには、Chromeの右上「︙」から「アプリをインストール」を選んでください。"; box.hidden = false; } }, 4000);
  btn.addEventListener("click", function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; box.hidden = true; }); });
  document.getElementById("installClose").addEventListener("click", function () { box.hidden = true; try { localStorage.setItem("installClosed", "1"); } catch (e) {} });
  window.addEventListener("appinstalled", function () { box.hidden = true; });
})();
</script>
